<div class="slack-message">
  <div class="slack-message__avatar">
    <img src="{{ user.profile.image_72 }}" alt="avatar" width="48" height="48" style="border-radius: 6px;">
  </div>
  <div class="slack-message__content">
    <div class="slack-message__header">
      <span class="slack-message__username">{{ user.display_name }}</span>
      <span class="slack-message__timestamp">{{ message.ts | slack_time }}</span>
    </div>
    <div class="slack-message__body">
      {{ message.text | e | nl2br }}
    </div>
    {# 今はリアクション・絵文字・添付ファイル等は未対応 #}
  </div>
</div>
